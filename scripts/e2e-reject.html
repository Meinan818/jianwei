<!doctype html>
<!--
  商家拒单回归测试（2026-09-28 修的 bug：商家拒单写不进数据库）

  背景：orders 的 INSERT 策略只放行顾客，UPDATE 策略才放行店主。
  `upsertOrder` 原来「先 INSERT 遇 23505 再 UPDATE」，商家插入会先撞 RLS 42501，
  于是拒单/接单永远写不进库 → 刷新后又变回"待接单"，顾客端也看不到。
  修复后：改成「先按主键 UPDATE，0 行再 INSERT」（见 orders-remote.ts 的 upsertByKey）。

  用法（配合 runner）：
    npm run build:standalone
    node scripts/e2e-smoke.mjs scripts/e2e-reject.html merchant
-->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>E2E 商家拒单</title></head>
<body style="font:12px/1.5 monospace">
<pre id="log">[start]</pre>
<iframe id="app" src="/" style="width:420px;height:820px;border:1px solid #ccc"></iframe>
<script>
const out = document.getElementById('log')
const log = (m) => { out.textContent += '\n' + m }
const sleep = (ms) => new Promise(r => setTimeout(r, ms))
const app = document.getElementById('app')
const doc = () => app.contentDocument
const win = () => app.contentWindow
const consoleErrors = []
let pass = false

async function waitFor(fn, timeout = 20000, label = '') {
  const t0 = Date.now()
  while (Date.now() - t0 < timeout) {
    try { const r = fn(); if (r) return r } catch (e) { /* not ready */ }
    await sleep(200)
  }
  throw new Error('等待超时: ' + label)
}
const btn = (text) =>
  [...doc().querySelectorAll('button,a')].find(e => e.textContent.trim().includes(text))
function setInput(el, value) {
  const w = win()
  const setter = Object.getOwnPropertyDescriptor(w.HTMLInputElement.prototype, 'value').set
  setter.call(el, value)
  el.dispatchEvent(new w.Event('input', { bubbles: true }))
}
// 读应用写在本机存储里的订单（scopedStorage 会给 key 加前缀，所以按后缀找）
function readOrders() {
  const store = win().localStorage
  for (let i = 0; i < store.length; i++) {
    const k = store.key(i)
    if (k && k.indexOf('food_delivery_orders') >= 0) {
      try { const arr = JSON.parse(store.getItem(k)); if (Array.isArray(arr)) return { key: k, orders: arr } } catch (e) { /* ignore */ }
    }
  }
  return { key: '(没找到订单存储)', orders: [] }
}

;(async () => {
  try {
    await new Promise(r => app.addEventListener('load', r, { once: true }))
    const origError = win().console.error.bind(win().console)
    win().console.error = (...a) => { consoleErrors.push(a.map(String).join(' ')); origError(...a) }

    await waitFor(() => doc().body.innerText.includes('商家端'), 20000, '启动页渲染')
    log('① 启动页正常')

    btn('商家端').click()
    await waitFor(() => doc().querySelector('input[placeholder*="手机号"]'), 20000, '登录页')
    const pwdTab = btn('密码')
    if (pwdTab) { pwdTab.click(); await sleep(400) }
    setInput(doc().querySelector('input[placeholder*="手机号"]'), '13800000002')
    setInput(doc().querySelector('input[type="password"]'), '123456')
    const agree = btn('我已阅读并同意')
    if (agree) { agree.click(); await sleep(300) }
    const loginBtn = [...doc().querySelectorAll('button')].find(b => b.textContent.trim() === '登录')
    loginBtn.click()
    await waitFor(() => (win().location.hash || '').includes('/merchant'), 30000, '进入商家端')
    log('② 商家端登录成功')

    win().location.hash = '#/merchant/orders'
    await sleep(3500)

    const before = readOrders()
    const pendingBefore = before.orders.filter(o => o.status === 'pending')
    log('③ 打开订单管理；本机订单 ' + before.orders.length + ' 笔，其中待接单 ' + pendingBefore.length + ' 笔')
    if (pendingBefore.length === 0) {
      log('⚠ 当前没有待接单订单，跳过本次拒单测试（想测就先在顾客端下一单）')
      log('SMOKE_RESULT=SKIP')
      log('[done]')
      return
    }
    const targetIds = pendingBefore.map(o => o.id)

    const rejectBtn = btn('拒单')
    if (!rejectBtn) throw new Error('订单卡片上找不到「拒单」按钮')
    rejectBtn.click()
    await waitFor(() => btn('确认拒单'), 8000, '拒单弹窗')
    log('④ 打开拒单弹窗')
    const chip = btn('食材不足')
    if (chip) { chip.click(); await sleep(300) }
    btn('确认拒单').click()
    log('⑤ 已点确认拒单')

    await sleep(5000)
    const after = readOrders()
    const rejected = after.orders.filter(o => targetIds.indexOf(o.id) >= 0 && o.status === 'rejected')
    const stillPending = after.orders.filter(o => targetIds.indexOf(o.id) >= 0 && o.status === 'pending')
    log('⑥ 本机状态：变为已拒单 ' + rejected.length + ' 笔，仍是待接单 ' + stillPending.length + ' 笔')
    if (rejected[0]) log('   被拒订单 ' + rejected[0].id + '，拒单原因=' + rejected[0].rejectReason)
    const flat = (doc().body.innerText || '').replace(/\n+/g, ' | ')
    log('   页面片段：' + flat.slice(0, 120))
    if (consoleErrors.length) log('⚠ console.error：' + consoleErrors.slice(0, 3).join(' / '))
    const merchantOk = rejected.length > 0
    log(merchantOk ? '✅ 商家端本机已记录拒单' : '❌ 商家端拒单没有生效')

    // 第二阶段：切成顾客端，确认顾客也看得到「已拒单」（用户反馈过"顾客端什么也不显示"）
    if (merchantOk) {
      win().location.hash = '#/'
      await sleep(1500)
      btn('顾客端').click()
      await waitFor(() => doc().querySelector('input[placeholder*="手机号"]'), 20000, '顾客登录页')
      const pwdTab2 = btn('密码')
      if (pwdTab2) { pwdTab2.click(); await sleep(400) }
      setInput(doc().querySelector('input[placeholder*="手机号"]'), '13800000001')
      setInput(doc().querySelector('input[type="password"]'), '123456')
      const agree2 = btn('我已阅读并同意')
      if (agree2) { agree2.click(); await sleep(300) }
      const login2 = [...doc().querySelectorAll('button')].find(b => b.textContent.trim() === '登录')
      login2.click()
      await waitFor(() => (win().location.hash || '').includes('/customer'), 30000, '进入顾客端')
      win().location.hash = '#/customer/orders'
      await sleep(3500)
      const tab = btn('历史订单')
      if (tab) { tab.click(); await sleep(1500) }
      const customerText = (doc().body.innerText || '').replace(/\n+/g, ' | ')
      const seen = customerText.indexOf('已拒单') >= 0
      log('⑦ 顾客端历史订单里出现「已拒单」：' + seen)
      log('   页面片段：' + customerText.slice(0, 140))
      if (!seen) log('❌ 顾客端没有显示拒单结果')
      pass = seen
    }
  } catch (e) {
    log('❌ 测试异常: ' + e.message)
    try { log('   页面文字: ' + (doc().body.innerText || '').replace(/\n+/g, ' | ').slice(0, 200)) } catch (e2) { /* ignore */ }
  }
  log('SMOKE_RESULT=' + (pass ? 'PASS' : 'FAIL'))
  log('[done]')
})()
</script>
</body>
</html>
